services:
  tensu:
    build: .
    ports:
      - "5000:5000"
    environment:
      - Database__Provider=SQLite
      - ConnectionStrings__SQLite=Data Source=/data/tensu.db
      - Jwt__Key=ChangeThisToASecureKeyInProduction!!
      - Encryption__Key=ChangeThisEncryptionKey32B!
    volumes:
      - tensu-data:/data
    restart: unless-stopped

volumes:
  tensu-data:
